<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HermesQA{% endblock %} · HermesQA</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27%232f5bea%27/%3E%3Cpath d=%27M9.5 16.5l4.5 4.5 9-10%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/ui.css">
<script src="/static/ui.js"></script>
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
{% block head %}{% endblock %}
</head>
<body>
<header class="appbar">
  <div class="wrap">
    <a class="brand" href="/dashboard">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--brand)"/><path d="M9.5 16.5l4.5 4.5 9-10" fill="none" stroke="var(--brand-fg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>HermesQA<small>Trang kỹ thuật</small></span>
    </a>
    <nav class="nav" aria-label="Điều hướng">
      <a href="/">Kiểm tra code</a>
      <a href="/dashboard" class="{{ 'active' if page == 'index' }}">Tổng quan</a>
      <a href="/dashboard/agents" class="{{ 'active' if page == 'agents' }}">Agent</a>
      <a href="/dashboard/runs" class="{{ 'active' if page == 'runs' }}">Lần chạy</a>
    </nav>
    <span class="spacer"></span>
    <div class="tools">
      <a class="btn-icon" href="https://github.com/zuberg0811/HermesQA" rel="noopener" title="Mã nguồn trên GitHub" aria-label="Mã nguồn trên GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.7.3 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5z"/></svg>
      </a>
      <button type="button" class="btn-icon theme-toggle" title="Chuyển sáng / tối" aria-label="Chuyển chế độ sáng tối">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>
<main class="wrap">
{% block body %}{% endblock %}
<footer class="footer">
  <span>Đồ án tốt nghiệp · Phí Thành Dương</span>
  <span>HermesQA · bot review pull request với ba agent AI và công cụ quét tĩnh</span>
</footer>
</main>
</body>
</html>
